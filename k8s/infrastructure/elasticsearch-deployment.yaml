apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: fiap-games
  labels:
    app: elasticsearch
    tier: infrastructure
spec:
  replicas: 1
  # O ES guarda estado no PVC ReadWriteOnce: dois pods não podem montar o mesmo volume,
  # então a troca tem que derrubar o antigo antes de subir o novo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # O diretório de dados do PVC nasce como root; o processo do ES roda com uid 1000
      # e não conseguiria escrever nele.
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:0 /usr/share/elasticsearch/data"]
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.5
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            # Nó único: sem eleição de master e sem réplicas de shard.
            - name: discovery.type
              value: "single-node"
            # Cluster interno ao namespace, atrás do Kong, sem exposição externa.
            # Habilitar security aqui exigiria distribuir certificado e senha; a troca
            # para um endpoint gerenciado (Elastic Cloud) se faz pela Secret da API.
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-pvc
