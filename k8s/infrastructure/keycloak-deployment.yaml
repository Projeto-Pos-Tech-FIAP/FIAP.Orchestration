apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: fiap-games
  labels:
    app: keycloak
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.5
          args:
            - start-dev
            - --import-realm
          ports:
            - containerPort: 8080
            - containerPort: 9000
              name: management
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: infra-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-postgres:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: infra-secret
                  key: KEYCLOAK_POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-secret
                  key: KEYCLOAK_POSTGRES_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: keycloak-realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            # Desde o Keycloak 26.x os endpoints de health ficam na porta de management (9000),
            # não mais na porta principal (8080) — apontar pra 8080 dava 404 sempre.
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: keycloak-realm
          configMap:
            name: keycloak-realm
