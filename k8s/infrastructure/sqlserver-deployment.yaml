apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: fiap-games
  labels:
    app: sqlserver
    tier: infrastructure
spec:
  replicas: 1
  # Evita dois pods disputando o mesmo PVC ReadWriteOnce durante um rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      # O disco gerenciado do Azure monta com dono root, e o SQL Server 2022 roda
      # como o usuario mssql (uid 10001) — sem isto ele falha ao criar /.system
      # com "Access Denied". fsGroup faz o kubelet dar o volume ao grupo do
      # processo. No minikube nao aparecia: hostPath e gravavel por todos.
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-secret
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -No
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-pvc
