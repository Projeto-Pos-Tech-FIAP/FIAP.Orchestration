apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-infra-config
  namespace: fiap-games
  labels:
    tier: shared
data:
  # Kafka — Service DNS dentro do cluster
  Kafka__BootstrapServers: "kafka:9092"
  Kafka__TopicOrderPlaced: "order-placed"
  Kafka__TopicPaymentProcessed: "payment-processed"
  Kafka__TopicUserCreated: "user-created"
  Kafka__TopicNotificationRequested: "notification-requested"
  Kafka__UserCreatedTopic: "user-created"
  Kafka__PaymentProcessedTopic: "payment-processed"

  # MongoDB
  MongoDb__Host: "mongodb"
  MongoDb__Port: "27017"
  MongoDb__CollectionName: "AuditLogs"
  # Logs de eventos de integração — base e coleção compartilhadas por Catalog, Payment
  # e Users, para que o fluxo de uma compra possa ser lido por CorrelationId de uma vez.
  MongoDb__EventsDatabaseName: "FcgEvents"
  MongoDb__EventsCollectionName: "EventLogs"

  # Redis
  ConnectionStrings__Redis: "redis:6379"
