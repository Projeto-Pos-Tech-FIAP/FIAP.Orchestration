apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: fiap-games
  labels:
    app: notification-api
    tier: service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-api
          image: fiap/notifications-api:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shared-infra-config
            - configMapRef:
                name: notification-api-config
            - secretRef:
                name: notification-api-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
