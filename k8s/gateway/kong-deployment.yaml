apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: fiap-games
  labels:
    app: kong-gateway
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong-gateway
  template:
    metadata:
      labels:
        app: kong-gateway
    spec:
      containers:
        - name: kong
          image: kong:3.7
          env:
            # DB-less: toda a config vem do kong.yml montado via ConfigMap.
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            # Sem isso, o nginx usa worker_processes=auto, que detecta as
            # CPUs do HOST (não o "cpu: 500m" abaixo do container) — em
            # hosts com muitos núcleos isso sobe workers demais e estoura o
            # limite de memória do pod, entrando num loop de kill/respawn.
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "1"
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
            - name: status
              containerPort: 8100
          volumeMounts:
            - name: declarative-config
              mountPath: /kong/declarative
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: declarative-config
          configMap:
            name: kong-declarative-config
