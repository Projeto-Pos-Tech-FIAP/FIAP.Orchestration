apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: fiap-games
  labels:
    app: kong-gateway
    tier: gateway
spec:
  selector:
    app: kong-gateway
  ports:
    - name: proxy
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
  # Único ponto de entrada externo do sistema FCG — todo o tráfego de
  # clientes passa por aqui. user-api e catalog-api continuam ClusterIP,
  # inacessíveis diretamente de fora do cluster.
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: fiap-games
  labels:
    app: kong-gateway
    tier: gateway
spec:
  selector:
    app: kong-gateway
  ports:
    - name: admin
      protocol: TCP
      port: 8001
      targetPort: 8001
    - name: status
      protocol: TCP
      port: 8100
      targetPort: 8100
  # Admin/status API nunca exposta externamente — apenas kubectl port-forward
  # para inspeção (kubectl get routes/services via :8001, health via :8100).
  type: ClusterIP
