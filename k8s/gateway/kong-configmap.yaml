apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: fiap-games
  labels:
    app: kong-gateway
    tier: gateway
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    # Kong roda em modo DB-less: toda a configuração (services, routes,
    # plugins, consumers) vive neste arquivo, versionado no repositório de
    # orquestração. Não há Admin API de escrita nem banco de dados do Kong.

    services:
      # UsersAPI — login/refresh ficam públicos (é como o cliente OBTÉM o
      # token). As rotas de gerenciamento de usuário exigem JWT válido.
      - name: user-api
        url: http://user-api.fiap-games.svc.cluster.local:80
        routes:
          - name: user-api-auth
            paths:
              - /api/auth
            strip_path: false

          - name: user-api-protected
            paths:
              - /api/users
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
                  key_claim_name: iss

      # CatalogAPI — catálogo de jogos e compras, sempre atrás de JWT.
      - name: catalog-api
        url: http://catalog-api.fiap-games.svc.cluster.local:80
        routes:
          - name: catalog-api-protected
            paths:
              - /api/game
              - /api/purchase
              - /api/eventlog
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
                  key_claim_name: iss

          # Busca do catálogo. É pública no código — SearchController não tem
          # [Authorize] no GET —, então não leva o plugin jwt: pesquisar jogo
          # não deveria exigir login. Restrita a GET para que o POST de
          # reindexação não caia aqui por casamento de prefixo.
          - name: catalog-api-search
            paths:
              - /api/search
            methods:
              - GET
            strip_path: false

          # Reindexação é operação administrativa (POST /api/search/reindex,
          # com [Authorize] no controller). Rota própria, com JWT validado já
          # no gateway, para que requisição sem token não chegue na API.
          - name: catalog-api-search-reindex
            paths:
              - /api/search/reindex
            methods:
              - POST
            strip_path: false
            plugins:
              - name: jwt
                config:
                  claims_to_verify:
                    - exp
                  key_claim_name: iss

    # Consumer que representa o Keycloak como emissor confiável de tokens.
    # O plugin jwt casa o claim "iss" do token com a "key" abaixo e valida a
    # assinatura RS256 usando a chave pública abaixo.
    #
    # IMPORTANTE: essa NÃO é uma credencial secreta — é a metade pública do
    # par de chaves RS256 do realm, o mesmo valor que qualquer cliente já
    # consegue ler sem autenticação em
    # /realms/TechChallengeFiap/protocol/openid-connect/certs. Não há
    # problema em versioná-la; o motivo de precisar de um script
    # (scripts/configure-kong-jwt.sh) é só operacional: o Keycloak gera um
    # par de chaves novo a cada realm importado do zero, então o valor real
    # só existe depois que o pod do Keycloak sobe pela primeira vez — não dá
    # pra saber o valor no momento do commit. A chave abaixo é um
    # placeholder RSA sintaticamente válido (mas descartável) só para o
    # Kong conseguir subir antes do script rodar; nenhum JWT genuíno do
    # Keycloak valida contra ela.
    consumers:
      - username: keycloak
        jwt_secrets:
          - key: http://keycloak/realms/TechChallengeFiap
            algorithm: RS256
            # BEGIN-KEYCLOAK-PUBLIC-KEY (scripts/configure-kong-jwt.sh substitui este bloco)
            rsa_public_key: |
              -----BEGIN PUBLIC KEY-----
              MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqHDvZdAkA8nmFM0fVpyJ
              VLjVPLchKqA6D3WlTXtKUZ9oh7tiqAH1C2G5CEvGXuEduuI+jFBqXIvrvD4joybF
              BeHQI/iCBPhL0+mEapjHPe6e4mmYAhJ3i2E85IicDtq/Jy3eLM74M90sPw2uFLcA
              RNl4Ea1MpmjjoVpR2D/8jSI5lRRyMv6vGar8x/uOOR78TSSXIOIaxL1akvyr8I9O
              ipYtgpry8wYUJrQiI2pgWaHLz/x/QnYc7Klc+HXEDPzyNJRT/Skj7SMHf0APFsaS
              B+qDkkGv5ddMzTGT2DmrR3Af0awP9yvoSxB3UGWY4Xp1lDRF0bhBkv4eSkqsNK9d
              EwIDAQAB
              -----END PUBLIC KEY-----
            # END-KEYCLOAK-PUBLIC-KEY
