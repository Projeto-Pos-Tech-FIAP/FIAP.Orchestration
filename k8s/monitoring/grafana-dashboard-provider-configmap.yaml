apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: fiap-games
  labels:
    app: grafana
    tier: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'FIAP Dashboards'
        orgId: 1
        folder: 'FIAP Games'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
