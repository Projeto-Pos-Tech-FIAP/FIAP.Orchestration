apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fiap-games
  labels:
    app: grafana
    tier: monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
