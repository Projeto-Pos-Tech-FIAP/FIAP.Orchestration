x-kafka-env: &kafka-env
  Kafka__BootstrapServers: kafka:9093
  Kafka__TopicOrderPlaced: order-placed
  Kafka__TopicPaymentProcessed: payment-processed
  Kafka__TopicUserCreated: user-created
  Kafka__TopicNotificationRequested: notification-requested
  Kafka__UserCreatedTopic: user-created
  Kafka__PaymentProcessedTopic: payment-processed

x-keycloak-env: &keycloak-client-env
  Keycloak__Authority: http://keycloak:8080/realms/TechChallengeFiap
  Keycloak__Audience: tech-challenge
  Keycloak__BaseUrl: http://keycloak:8080/
  Keycloak__Realm: TechChallengeFiap
  Keycloak__ClientId: tech-challenge
  Keycloak__ClientSecret: "${KEYCLOAK_CLIENT_SECRET:?defina no .env}"

x-datastore-env: &datastore-env
  # MongoDB — logs de eventos de integração (coleção compartilhada entre os serviços)
  MongoDb__Host: mongodb
  MongoDb__Port: "27017"
  MongoDb__Username: "${MONGO_INITDB_ROOT_USERNAME:?defina no .env}"
  MongoDb__Password: "${MONGO_INITDB_ROOT_PASSWORD:?defina no .env}"
  MongoDb__EventsDatabaseName: FcgEvents
  MongoDb__EventsCollectionName: EventLogs
  # Redis — cache distribuído
  ConnectionStrings__Redis: redis:6379

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiap-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina no .env}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: fiap-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?defina no .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?defina no .env}"
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fiap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Elasticsearch — motor da busca avançada do catálogo (só a CatalogAPI usa)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.5
    container_name: fiap-elasticsearch
    environment:
      # Nó único: sem eleição de master e sem réplicas de shard.
      discovery.type: single-node
      # Security desligada apenas no ambiente local, onde não há credencial a proteger.
      # Para um endpoint gerenciado (Elastic Cloud / Amazon OpenSearch) a API recebe
      # Elasticsearch__ApiKey pela Secret, e nada disso é versionado.
      xpack.security.enabled: "false"
      # Sem teto de heap o ES reserva alguns GB de RAM da máquina de dev.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fiap-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      # O ZooKeeper reconstrói o estado com snapshot + transaction log. Sem persistir
      # /var/lib/zookeeper/log ele volta vazio a cada recriação do container, perde o
      # znode /cluster/id e gera um cluster novo — enquanto o Kafka, que TEM volume,
      # guarda o id antigo em meta.properties. Resultado: InconsistentClusterIdException
      # e o broker se recusando a subir depois de todo `docker compose down`.
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fiap-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listener TUNNEL (9094): exclusivo para o túnel ngrok que a Lambda usa via
      # self-managed Kafka trigger. SASL_SSL porque a AWS Lambda exige TLS pra
      # brokers acessíveis pela internet pública. Reaproveita o mesmo certificado
      # e credenciais gerados em FIAP.NotificationsAPI/kafka-certs.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092,TUNNEL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092,TUNNEL://${TUNNEL_ADVERTISED_ADDRESS:-localhost:9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,TUNNEL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_LISTENER_NAME_TUNNEL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="lambda" password="${KAFKA_TUNNEL_SASL_PASSWORD:?defina no .env}" user_lambda="${KAFKA_TUNNEL_SASL_PASSWORD:?defina no .env}";'
      KAFKA_LISTENER_NAME_TUNNEL_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.p12
      KAFKA_LISTENER_NAME_TUNNEL_SSL_KEYSTORE_PASSWORD: "${KAFKA_TUNNEL_KEYSTORE_PASSWORD:?defina no .env}"
      KAFKA_LISTENER_NAME_TUNNEL_SSL_KEY_PASSWORD: "${KAFKA_TUNNEL_KEYSTORE_PASSWORD:?defina no .env}"
      KAFKA_LISTENER_NAME_TUNNEL_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_LISTENER_NAME_TUNNEL_SSL_CLIENT_AUTH: none
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE já cria os tópicos (order-placed, payment-processed,
      # user-created, notification-requested) sob demanda, no primeiro publish de cada um.
      # KAFKA_CREATE_TOPICS não existe nesta imagem (confluentinc/cp-kafka) — é uma variável
      # da imagem wurstmeister/kafka; aqui era ignorada silenciosamente, então foi removida.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
      # Sem .env: usa o keystore "de mentira" versionado (Kafka sobe normal, listener
      # TUNNEL fica inerte). Pra Lambda de verdade, gere certificados com
      # FIAP.NotificationsAPI/generate-kafka-tunnel-certs.sh e defina KAFKA_CERTS_DIR
      # no seu .env apontando pra ../FIAP.NotificationsAPI/kafka-certs
      - ${KAFKA_CERTS_DIR:-../FIAP.NotificationsAPI/kafka-certs-default}:/etc/kafka/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fiap-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093

  keycloak-postgres:
    image: postgres:15
    container_name: fiap-keycloak-postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: "${KEYCLOAK_POSTGRES_USER:?defina no .env}"
      POSTGRES_PASSWORD: "${KEYCLOAK_POSTGRES_PASSWORD:?defina no .env}"
    ports:
      - "5432:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    container_name: fiap-keycloak
    command: start-dev --import-realm
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:?defina no .env}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?defina no .env}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?defina no .env}"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: "${KEYCLOAK_POSTGRES_USER:?defina no .env}"
      KC_DB_PASSWORD: "${KEYCLOAK_POSTGRES_PASSWORD:?defina no .env}"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"

  catalog-api:
    build:
      context: ../FIAP.CatalogAPI
      dockerfile: Dockerfile
    container_name: fiap-catalog-api
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      <<: [*kafka-env, *keycloak-client-env, *datastore-env]
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CatalogAPI;User Id=sa;Password=${MSSQL_SA_PASSWORD:?defina no .env};TrustServerCertificate=True"
      # Base/coleção de auditoria (só a CatalogAPI tem); os logs de eventos usam a base
      # compartilhada definida em x-datastore-env.
      MongoDb__DatabaseName: CatalogAudit
      MongoDb__CollectionName: AuditLogs
      Cache__InstanceName: "catalog:"
      Cache__DefaultTtlSeconds: "600"
      # Busca avançada — índice de jogos no Elasticsearch
      Elasticsearch__Uri: http://elasticsearch:9200
      Elasticsearch__GamesIndex: games
      Elasticsearch__RequestTimeoutSeconds: "10"
      Elasticsearch__Fuzziness: AUTO
    restart: on-failure

  usuarios-api:
    build:
      context: ../FIAP.UsersAPI
      dockerfile: Dockerfile
    container_name: fiap-usuarios-api
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "5002:8080"
    environment:
      <<: [*kafka-env, *keycloak-client-env, *datastore-env]
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=UsuariosDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?defina no .env};TrustServerCertificate=True"
      Cache__InstanceName: "usersapi:"
      Cache__DefaultTtlSeconds: "60"
    restart: on-failure

  payment-api:
    build:
      context: ../FIAP.PaymentAPI
      dockerfile: Dockerfile
    container_name: fiap-payment-api
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5003:8080"
    environment:
      <<: [*kafka-env, *datastore-env]
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    restart: on-failure

  notifications-api:
    build:
      context: ../FIAP.NotificationsAPI
      dockerfile: Dockerfile
    container_name: fiap-notifications-api
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5004:8080"
    environment:
      <<: *kafka-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: fiap-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: fiap-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?defina no .env}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?defina no .env}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: on-failure

volumes:
  sqlserver_data:
  elasticsearch_data:
  mongo_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  keycloak_postgres_data:
  prometheus_data:
  grafana_data:
