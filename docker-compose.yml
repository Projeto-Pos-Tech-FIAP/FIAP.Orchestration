x-kafka-env: &kafka-env
  Kafka__BootstrapServers: kafka:9093
  Kafka__TopicOrderPlaced: order-placed
  Kafka__TopicPaymentProcessed: payment-processed
  Kafka__TopicUserCreated: user-created
  Kafka__TopicNotificationRequested: notification-requested
  Kafka__UserCreatedTopic: user-created
  Kafka__PaymentProcessedTopic: payment-processed

x-keycloak-env: &keycloak-client-env
  Keycloak__Authority: http://keycloak:8080/realms/TechChallengeFiap
  Keycloak__Audience: tech-challenge
  Keycloak__BaseUrl: http://keycloak:8080/
  Keycloak__Realm: TechChallengeFiap
  Keycloak__ClientId: tech-challenge
  Keycloak__ClientSecret: TDB539JXqWeqNmrzFwtT7UNMQXtIwj1Y

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiap-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PosTech@123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PosTech@123' -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: fiap-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "PosTech@123"
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fiap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fiap-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fiap-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listener TUNNEL (9094): exclusivo para o túnel ngrok que a Lambda usa via
      # self-managed Kafka trigger. SASL_SSL porque a AWS Lambda exige TLS pra
      # brokers acessíveis pela internet pública. Reaproveita o mesmo certificado
      # e credenciais gerados em FIAP.NotificationsAPI/kafka-certs.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092,TUNNEL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092,TUNNEL://${TUNNEL_ADVERTISED_ADDRESS:-localhost:9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,TUNNEL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_LISTENER_NAME_TUNNEL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="lambda" password="${KAFKA_TUNNEL_SASL_PASSWORD:-kafka-tunnel-default-pass}" user_lambda="${KAFKA_TUNNEL_SASL_PASSWORD:-kafka-tunnel-default-pass}";'
      KAFKA_LISTENER_NAME_TUNNEL_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.p12
      KAFKA_LISTENER_NAME_TUNNEL_SSL_KEYSTORE_PASSWORD: "${KAFKA_TUNNEL_KEYSTORE_PASSWORD:-kafka-tunnel-default-pass}"
      KAFKA_LISTENER_NAME_TUNNEL_SSL_KEY_PASSWORD: "${KAFKA_TUNNEL_KEYSTORE_PASSWORD:-kafka-tunnel-default-pass}"
      KAFKA_LISTENER_NAME_TUNNEL_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_LISTENER_NAME_TUNNEL_SSL_CLIENT_AUTH: none
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE já cria os tópicos (order-placed, payment-processed,
      # user-created, notification-requested) sob demanda, no primeiro publish de cada um.
      # KAFKA_CREATE_TOPICS não existe nesta imagem (confluentinc/cp-kafka) — é uma variável
      # da imagem wurstmeister/kafka; aqui era ignorada silenciosamente, então foi removida.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
      # Sem .env: usa o keystore "de mentira" versionado (Kafka sobe normal, listener
      # TUNNEL fica inerte). Pra Lambda de verdade, gere certificados com
      # FIAP.NotificationsAPI/generate-kafka-tunnel-certs.sh e defina KAFKA_CERTS_DIR
      # no seu .env apontando pra ../FIAP.NotificationsAPI/kafka-certs
      - ${KAFKA_CERTS_DIR:-../FIAP.NotificationsAPI/kafka-certs-default}:/etc/kafka/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fiap-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093

  keycloak-postgres:
    image: postgres:15
    container_name: fiap-keycloak-postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    container_name: fiap-keycloak
    command: start-dev --import-realm
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"

  catalog-api:
    build:
      context: ../FIAP.CatalogAPI
      dockerfile: Dockerfile
    container_name: fiap-catalog-api
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "5001:8080"
    environment:
      <<: [*kafka-env, *keycloak-client-env]
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CatalogAPI;User Id=sa;Password=PosTech@123;TrustServerCertificate=True"
      MongoDb__Host: mongodb
      MongoDb__Port: "27017"
      MongoDb__Username: admin
      MongoDb__Password: "PosTech@123"
      MongoDb__DatabaseName: CatalogAudit
      MongoDb__CollectionName: AuditLogs
    restart: on-failure

  usuarios-api:
    build:
      context: ../FIAP.UsersAPI
      dockerfile: Dockerfile
    container_name: fiap-usuarios-api
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "5002:8080"
    environment:
      <<: [*kafka-env, *keycloak-client-env]
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=UsuariosDb;User Id=sa;Password=PosTech@123;TrustServerCertificate=True"
    restart: on-failure

  payment-api:
    build:
      context: ../FIAP.PaymentAPI
      dockerfile: Dockerfile
    container_name: fiap-payment-api
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5003:8080"
    environment:
      <<: *kafka-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    restart: on-failure

  notifications-api:
    build:
      context: ../FIAP.NotificationsAPI
      dockerfile: Dockerfile
    container_name: fiap-notifications-api
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5004:8080"
    environment:
      <<: *kafka-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: fiap-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: fiap-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: on-failure

volumes:
  sqlserver_data:
  mongo_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  keycloak_postgres_data:
  prometheus_data:
  grafana_data:
