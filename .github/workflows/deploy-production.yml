name: deploy-production

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "environments/**"
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # Troca do token do GitHub por um do Azure para falar com o AKS (OIDC).
  id-token: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Rolling update (Kubernetes)
    needs: validate
    # Com o cluster gerenciado no Azure o deploy roda em runner hospedado; o
    # self-hosted só é necessário para um cluster que não é alcançável pela
    # internet, como o minikube local.
    runs-on: ${{ vars.DEPLOY_RUNS_ON || 'ubuntu-latest' }}
    environment:
      name: production
    env:
      NAMESPACE: fiap-games
      OVERLAY: environments/production
      SERVICES: "catalog-api user-api payment-api notification-api"
      ROLLOUT_TIMEOUT: "300s"
    steps:
      - uses: actions/checkout@v6

      # ─── Acesso ao cluster ───────────────────────────────────────────────
      # Caminho 1 (AKS): OIDC + az aks get-credentials. Nenhum kubeconfig e
      # nenhuma credencial de nuvem guardados no GitHub.
      - name: Azure login (OIDC)
        if: vars.AKS_CLUSTER_NAME != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        if: vars.AKS_CLUSTER_NAME != ''
        shell: bash
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          # kubelogin: o cluster usa Entra ID, então o kubectl precisa trocar o
          # token do az por um token do cluster.
          az aks install-cli \
            --install-location "$HOME/.local/bin/kubectl" \
            --kubelogin-install-location "$HOME/.local/bin/kubelogin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      # Caminho 2 (transição): kubeconfig em Secret, para cluster que não é AKS.
      - name: Configure kubeconfig
        if: vars.AKS_CLUSTER_NAME == ''
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
            chmod 600 "$RUNNER_TEMP/kubeconfig"
            echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          fi

      - name: Cluster info
        shell: bash
        run: |
          kubectl version
          kubectl config current-context
          kubectl get nodes

      - name: Ensure namespace
        shell: bash
        run: kubectl apply -f k8s/00-namespace.yaml

      # Com o ACR anexado ao AKS (--attach-acr) a identidade do kubelet já tem
      # AcrPull, então não existe imagePullSecret a criar. O passo abaixo só
      # serve ao GHCR, e põe o secret na ServiceAccount em vez de no manifesto
      # do Deployment — assim nada disso fica versionado no overlay.
      - name: Ensure GHCR pull secret
        if: vars.ACR_LOGIN_SERVER == ''
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
        run: |
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "GHCR_PULL_TOKEN não configurado: assumindo pacotes públicos no GHCR."
            exit 0
          fi
          kubectl create secret docker-registry registry-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_PULL_USERNAME:-$GITHUB_REPOSITORY_OWNER}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n "$NAMESPACE" \
            -p '{"imagePullSecrets":[{"name":"registry-pull-secret"}]}'

      - name: Ensure application secrets
        shell: bash
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          KEYCLOAK_POSTGRES_USER: ${{ secrets.KEYCLOAK_POSTGRES_USER }}
          KEYCLOAK_POSTGRES_PASSWORD: ${{ secrets.KEYCLOAK_POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          if [ -n "$MSSQL_SA_PASSWORD" ]; then
            bash scripts/create-k8s-secrets.sh
            exit 0
          fi
          echo "Secrets da aplicação não configurados no GitHub: exigindo os já existentes no cluster."
          for s in infra-secret catalog-api-secret user-api-secret payment-api-secret notification-api-secret; do
            if ! kubectl get secret "$s" -n "$NAMESPACE" > /dev/null; then
              echo "::error::Secret $s não existe no cluster. Rode scripts/create-k8s-secrets.sh ou configure os secrets no GitHub."
              exit 1
            fi
          done

      - name: Diff
        shell: bash
        run: kubectl diff -k "$OVERLAY" || true

      - name: Apply
        shell: bash
        run: kubectl apply -k "$OVERLAY"

      - name: Wait for rollout
        shell: bash
        run: |
          failed=""
          for d in $SERVICES; do
            echo "::group::rollout $d"
            if ! kubectl rollout status "deployment/$d" -n "$NAMESPACE" --timeout="$ROLLOUT_TIMEOUT"; then
              failed="$failed $d"
              kubectl describe "deployment/$d" -n "$NAMESPACE" | tail -n 30
              kubectl get pods -n "$NAMESPACE" -l "app=$d" -o wide
              kubectl logs -n "$NAMESPACE" -l "app=$d" --tail=50 --all-containers --prefix || true
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Rollout não concluído para:$failed. A versão anterior continua servindo tráfego (maxUnavailable=0)."
            exit 1
          fi

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Produção — namespace \`$NAMESPACE\`"
            echo ""
            echo "| Deployment | Imagem | Prontos |"
            echo "|---|---|---|"
            for d in $SERVICES; do
              img=$(kubectl get "deployment/$d" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "-")
              ready=$(kubectl get "deployment/$d" -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}/{.spec.replicas}' 2>/dev/null || echo "-")
              echo "| $d | \`$img\` | $ready |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
