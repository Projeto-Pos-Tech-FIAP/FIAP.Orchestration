global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'catalog-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['catalog-api:8080']

  - job_name: 'usuarios-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['usuarios-api:8080']

  - job_name: 'payment-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['payment-api:8080']

  - job_name: 'notifications-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['notifications-api:8080']
